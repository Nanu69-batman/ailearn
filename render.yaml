# Render Blueprint for the API (Dashboard -> New -> Blueprint -> this repo).
# Secrets are marked sync: false: Render asks for their values on first
# deploy and never reads them from this file.
services:
  - type: web
    name: malai-pioneer-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      # Agentic chat (OpenRouter tool calling). Unset = classic Gemini pipeline.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: LMS_LAUNCH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: VECTOR_STORE
        value: pinecone
      - key: PINECONE_INDEX
        value: ailearn-llama
      # Pinecone Inference embeds chunks and queries (1024-d, llama-text-embed-v2).
      - key: EMBEDDING_PROVIDER
        value: pinecone
      - key: ALLOW_UNSIGNED_LAUNCH
        value: "false"
      - key: LOCAL_WHISPER_FALLBACK
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_VIDEO_MINUTES
        value: "15"
      - key: MAX_UPLOADS_PER_HOUR
        value: "10"
